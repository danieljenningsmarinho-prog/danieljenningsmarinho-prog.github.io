<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005CA1">
  <meta name="description" content="Protótipo de teste do quiz Mapa de leitura da família, da revista Nosso Amiguinho. Nada é enviado e nenhum dado é coletado.">
  <title>Mapa de leitura da família — protótipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --blue: #005CA1;
  --blue-deep: #023E73;
  --blue-mid: #1A7BC4;
  --blue-soft: #E8F4FC;
  --yellow: #FFE800;
  --yellow-hi: #FFF56A;
  --yellow-shadow: #C9B400;
  --navy: #0A3A66;
  --white: #ffffff;
  --red: #E53935;
  --green: #2E9B4A;
  --gold: #FFD24A;
  --gold-deep: #E6A800;
  --cream: #FFF8E1;
  --shadow: 0 14px 34px rgba(2, 40, 80, 0.18);
  --font: "Fredoka", "Baloo 2", "Nunito", "Segoe UI Rounded", "Trebuchet MS", sans-serif;
  --display: "Baloo 2", "Fredoka", "Nunito", "Segoe UI Rounded", "Trebuchet MS", sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: var(--font);
  color: var(--navy);
  background: var(--blue-deep);
  -webkit-tap-highlight-color: transparent;
}
body { min-height: 100dvh; overflow-x: hidden; }
.sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: linear-gradient(165deg, #023E73 0%, #005CA1 42%, #1A7BC4 78%, #3A99D4 100%);
  overflow: hidden;
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(8px);
  opacity: 0.35;
  animation: floaty 16s ease-in-out infinite;
}
.b1 { width: 280px; height: 220px; background: #7ec8f0; top: -40px; left: -60px; }
.b2 { width: 220px; height: 220px; background: #ffe27a; bottom: 8%; right: -70px; opacity: 0.22; animation-duration: 20s; animation-delay: -4s; }
.b3 { width: 180px; height: 160px; background: #b8ecff; top: 42%; left: -50px; animation-duration: 18s; animation-delay: -8s; }
.cloud {
  position: absolute;
  background: rgba(255,255,255,0.88);
  border-radius: 40px;
  filter: drop-shadow(0 8px 10px rgba(2,40,80,0.08));
  animation: drift 32s linear infinite;
}
.cloud:before, .cloud:after {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
}
.cloud:before { width: 46px; height: 46px; top: -22px; left: 18px; }
.cloud:after { width: 62px; height: 62px; top: -30px; left: 46px; }
.c1 { width: 110px; height: 36px; top: 10%; left: -120px; animation-duration: 36s; }
.c2 { width: 90px; height: 30px; top: 22%; left: -160px; opacity: 0.8; animation-duration: 44s; animation-delay: -18s; }
.c3 { width: 130px; height: 38px; top: 68%; left: -140px; opacity: 0.75; animation-duration: 40s; animation-delay: -8s; }
.sky-star {
  position: absolute;
  color: #FFE800;
  text-shadow: 0 0 8px rgba(255,232,0,0.8);
  animation: twinkle 3.4s ease-in-out infinite, rise 18s linear infinite;
  pointer-events: none;
  line-height: 1;
}
@keyframes floaty {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(18px, -16px) scale(1.08); }
}
@keyframes drift {
  from { transform: translateX(0); }
  to { transform: translateX(calc(100vw + 220px)); }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.35; transform: scale(0.8) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.15) rotate(12deg); }
}
@keyframes rise {
  from { transform: translateY(20px); }
  to { transform: translateY(-30px); }
}
.wrap {
  position: relative;
  z-index: 2;
  max-width: 430px;
  margin: 0 auto;
  padding: 14px 12px 28px;
  min-height: 100dvh;
}
.note {
  background: rgba(255,255,255,0.92);
  border-radius: 16px;
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--navy);
  margin: 0 0 12px;
  box-shadow: 0 8px 20px rgba(2,40,80,0.12);
}
.note strong {
  display: block;
  font-family: var(--display);
  font-weight: 700;
  margin-bottom: 2px;
}
.app {
  position: relative;
  background: transparent;
}
.app.shake { animation: shake 0.55s ease; }
@keyframes shake {
  0%, 100% { transform: translate(0); }
  18% { transform: translate(-7px, 3px) rotate(-0.7deg); }
  36% { transform: translate(7px, -3px) rotate(0.6deg); }
  54% { transform: translate(-5px, 2px) rotate(-0.4deg); }
  72% { transform: translate(4px, -1px) rotate(0.3deg); }
}
.card {
  background: var(--white);
  border-radius: 30px;
  box-shadow: var(--shadow), 0 0 0 4px rgba(255,255,255,0.22);
  overflow: hidden;
  min-height: 560px;
  position: relative;
}
.header {
  background: linear-gradient(180deg, #005CA1 0%, #066BB8 100%);
  color: white;
  text-align: center;
  padding: 16px 16px 18px;
  position: relative;
  overflow: hidden;
}
.header:after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -18px;
  height: 36px;
  background: var(--white);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}
.badge {
  display: block;
  width: max-content;
  margin: 0 auto 8px;
  background: var(--yellow);
  color: var(--navy);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  padding: 4px 11px;
  border-radius: 999px;
  margin-bottom: 8px;
  box-shadow: 0 3px 0 var(--yellow-shadow);
}
.brand-nosso {
  display: block;
  width: max-content;
  margin: 0 auto;
  background: white;
  color: var(--blue);
  font-family: var(--display);
  font-weight: 800;
  letter-spacing: 2px;
  font-size: 12px;
  padding: 3px 12px;
  border-radius: 6px;
}
.brand-ami {
  font-family: var(--display);
  font-weight: 800;
  font-size: 26px;
  letter-spacing: 0.4px;
  color: var(--yellow);
  line-height: 1;
  margin-top: 2px;
  text-shadow: 0 2px 0 rgba(0,0,0,0.12);
}
.header-sub { margin-top: 6px; font-size: 13px; font-weight: 600; opacity: 0.95; position: relative; z-index: 1; }
.stage { padding: 4px 16px 20px; position: relative; }
.stage.slide-in { animation: slideIn 0.4s cubic-bezier(.22,.8,.3,1); }
.stage.pop-in { animation: popIn 0.45s cubic-bezier(.2,1.3,.3,1); }
@keyframes slideIn {
  from { transform: translateX(46px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes popIn {
  from { transform: scale(0.92); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
h1.title {
  font-family: var(--display);
  font-weight: 800;
  font-size: 30px;
  line-height: 1.15;
  text-align: center;
  margin: 8px 0 12px;
  color: var(--blue);
}
p { margin: 0 0 12px; font-size: 15.5px; line-height: 1.5; }
.muted { font-size: 13.5px; color: #2a5578; }
.btn, .btn-quiet, .opt, .visit {
  font-family: var(--display);
  cursor: pointer;
  appearance: none;
}
.btn {
  width: 100%;
  min-height: 62px;
  border: none;
  border-radius: 20px;
  background: linear-gradient(#FFF56A, #FFE800);
  color: var(--navy);
  font-weight: 800;
  font-size: 20px;
  padding: 12px 16px;
  box-shadow: 0 7px 0 var(--yellow-shadow), 0 12px 18px rgba(10,58,102,0.16);
  transform: translateY(0);
  transition: transform 80ms ease, box-shadow 80ms ease;
}
.btn:active {
  transform: translateY(6px);
  box-shadow: 0 1px 0 var(--yellow-shadow), 0 4px 8px rgba(10,58,102,0.12);
}
.btn-quiet {
  width: 100%;
  min-height: 52px;
  margin-top: 12px;
  border: 3px solid var(--blue);
  border-radius: 18px;
  background: white;
  color: var(--blue);
  font-weight: 700;
  font-size: 17px;
  padding: 10px 16px;
  box-shadow: 0 4px 0 #0a4e86;
  transform: translateY(0);
  transition: transform 80ms ease, box-shadow 80ms ease;
}
.btn-quiet:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #0a4e86;
}
.progress { padding: 2px 2px 10px; }
.progress-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}
.bar {
  height: 12px;
  background: var(--blue-soft);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0,92,161,0.15);
}
.bar > span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #FFE800, #FFC400);
  box-shadow: 0 0 0 1px rgba(201,180,0,0.35);
  transition: width 400ms ease;
}
.seals { display: flex; justify-content: space-between; margin-top: 12px; }
.seal-dot { text-align: center; width: 24%; }
.seal-circle {
  width: 40px; height: 40px;
  margin: 0 auto 4px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  background: #F0F5F9;
  border: 3px solid #D3E0EA;
}
.seal-circle.got {
  background: linear-gradient(#FFF56A, #FFE800);
  border-color: var(--blue);
  animation: starPop 500ms ease;
  box-shadow: 0 4px 0 var(--yellow-shadow);
}
.seal-circle.current { background: var(--blue-soft); border-color: var(--blue); }
.seal-label { font-size: 13px; }
@keyframes starPop {
  0% { transform: scale(0) rotate(-30deg); }
  70% { transform: scale(1.25) rotate(10deg); }
  100% { transform: scale(1) rotate(0); }
}
.medal-hint {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--blue);
  margin: 0 0 10px;
}
.phase-kicker {
  color: var(--blue);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.3px;
  margin: 0 0 6px;
  text-transform: uppercase;
}
.q-title {
  font-family: var(--display);
  font-size: 22px;
  line-height: 1.25;
  margin: 0 0 14px;
  font-weight: 800;
}
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  min-height: 70px;
  padding: 10px 14px;
  border-radius: 20px;
  border: 3px solid #D3E4F0;
  background: #fff;
  color: var(--navy);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  box-shadow: 0 4px 0 #D3E4F0;
  transition: transform 80ms ease, box-shadow 80ms ease, background 120ms ease;
}
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 #D3E4F0; }
.opt.selected {
  background: linear-gradient(#FFFBE6, #FFE800);
  border-color: var(--blue);
  box-shadow: 0 4px 0 #0a4e86;
}
.ico {
  flex: 0 0 46px;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--blue-soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}
.opt.selected .ico { background: white; }
.praise-row, .mascot-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-top: 16px;
}
.bubble {
  background: var(--cream);
  border: 2px solid #FFE08A;
  border-radius: 18px 18px 18px 6px;
  padding: 10px 12px;
  font-weight: 600;
  font-size: 14px;
  line-height: 1.35;
  flex: 1;
  animation: bubbleIn 0.35s ease;
  position: relative;
}
@keyframes bubbleIn {
  from { transform: scale(0.8) translateY(8px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}
.mascot {
  width: 72px;
  height: 72px;
  flex: 0 0 72px;
  animation: bob 2.6s ease-in-out infinite;
  filter: drop-shadow(0 6px 6px rgba(10,58,102,0.18));
}
.mascot.talk { animation: bounceTalk 0.6s ease; }
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-7px) rotate(3deg); }
}
@keyframes bounceTalk {
  0% { transform: scale(0.9) rotate(-8deg); }
  50% { transform: scale(1.08) rotate(6deg); }
  100% { transform: translateY(0) rotate(-3deg); }
}
.phase-screen { text-align: center; padding-top: 6px; }
.star-pop { font-size: 48px; animation: starPop 600ms ease; }
.seal-big {
  width: 128px; height: 128px;
  margin: 8px auto 12px;
  border-radius: 50%;
  background: linear-gradient(#FFF56A, #FFE800);
  border: 6px solid var(--blue);
  display: flex; align-items: center; justify-content: center;
  font-size: 56px;
  box-shadow: 0 8px 0 #0a4e86, 0 14px 22px rgba(10,58,102,0.2);
  animation: sealIn 700ms cubic-bezier(.2,1.3,.3,1);
}
@keyframes sealIn {
  0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
  60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}
.unlock {
  margin: 12px auto 14px;
  display: inline-block;
  background: var(--blue);
  color: white;
  font-family: var(--display);
  font-weight: 800;
  font-size: 20px;
  padding: 10px 20px;
  border-radius: 999px;
  animation: bubbleIn 450ms ease;
  box-shadow: 0 5px 0 #023E73;
}
.tip-card {
  background: linear-gradient(#FFFDF2, #FFF3B0);
  border: 3px solid var(--yellow);
  border-radius: 24px;
  padding: 16px;
  animation: bubbleIn 400ms ease;
}
.tip-kicker {
  font-weight: 800;
  color: var(--blue);
  font-size: 13px;
  letter-spacing: 0.4px;
}
.curiosity {
  color: var(--blue);
  font-family: var(--display);
  font-weight: 800;
  font-size: 18px;
  text-align: center;
  margin: 14px 0 16px;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.profile-card {
  margin: 14px 0 8px;
  background: var(--blue-soft);
  border-radius: 22px;
  padding: 16px;
  text-align: left;
}
.profile-name {
  font-family: var(--display);
  font-weight: 800;
  font-size: 22px;
  color: var(--blue);
}
.invite {
  font-family: var(--display);
  font-size: 18px;
  line-height: 1.35;
  margin: 16px 0 10px;
  font-weight: 800;
  text-align: center;
}
.visits { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.visit {
  width: 100%;
  min-height: 54px;
  border-radius: 16px;
  border: 3px solid var(--blue);
  background: white;
  color: var(--navy);
  font-weight: 700;
  font-size: 16px;
  box-shadow: 0 4px 0 #0a4e86;
}
.visit.selected { background: linear-gradient(#FFF56A, #FFE800); }
.visit:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a4e86; }
.confirm {
  border-radius: 16px;
  padding: 12px;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 14px;
  text-align: left;
}
.confirm.yes { background: var(--cream); border: 2px solid var(--yellow); }
.confirm.no { background: var(--blue-soft); border: 2px solid var(--blue); }
.result-pad { text-align: center; padding-top: 4px; }
.veil {
  display: none;
}
@keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
.result-title {
  font-family: var(--display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1.35;
  color: var(--blue);
  margin: 4px 0 10px;
  position: relative;
  z-index: 3;
}
.result-title .line { white-space: nowrap; display: inline-block; }
.result-title .letter {
  display: inline-block;
  animation: letterBounce 0.55s cubic-bezier(.2,1.4,.3,1) both;
}
@keyframes letterBounce {
  0% { transform: scale(0.2) translateY(14px); opacity: 0; }
  60% { transform: scale(1.12) translateY(-6px); opacity: 1; }
  100% { transform: scale(1) translateY(0); }
}
.medal-stage {
  position: relative;
  width: 210px;
  height: 230px;
  margin: 0 auto 8px;
  z-index: 3;
}
.rays {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255,232,0,0) 0 14deg, rgba(255,232,0,0.55) 0 18deg);
  animation: spinRays 10s linear infinite;
  filter: blur(0.3px);
  z-index: 0;
}
@keyframes spinRays { to { transform: rotate(360deg); } }
.medal-3d {
  position: relative;
  z-index: 1;
  width: 170px;
  margin: 18px auto 0;
  transform-style: preserve-3d;
  animation: medalSpin 1.15s cubic-bezier(.2,1.15,.3,1) both;
  filter: drop-shadow(0 12px 14px rgba(10,58,102,0.3));
}
@keyframes medalSpin {
  0% { transform: perspective(700px) rotateY(-200deg) scale(0.35); opacity: 0; }
  55% { transform: perspective(700px) rotateY(22deg) scale(1.08); opacity: 1; }
  100% { transform: perspective(700px) rotateY(0) scale(1); }
}
.medal-3d .shine {
  position: absolute;
  inset: 38px 8px 8px;
  border-radius: 50%;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.75) 48%, transparent 62%);
  animation: shineSweep 2.2s ease-in-out 0.7s infinite;
  pointer-events: none;
}
@keyframes shineSweep {
  0% { transform: translateX(-40%) rotate(15deg); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateX(40%) rotate(15deg); opacity: 0; }
}
.medal-caption {
  font-family: var(--display);
  font-weight: 800;
  font-size: 15px;
  line-height: 1.2;
  color: var(--navy);
  margin-top: -6px;
  position: relative;
  z-index: 2;
}
.medal-mini { width: 54px; margin: 0 auto; filter: blur(5px) saturate(0.85); pointer-events: none; }
.medal-mini .medal-caption { display: none; }
#fx {
  position: fixed;
  inset: 0;
  z-index: 35;
  pointer-events: none;
}
.confetti-layer {
  position: fixed;
  inset: 0;
  z-index: 36;
  pointer-events: none;
  overflow: hidden;
}
.wrap, .app, .card { position: relative; z-index: 5; }
.card { z-index: 5; }

.confetti-piece { position: absolute; animation-fill-mode: both; }
.wave-top { animation-name: waveTop; }
.wave-left { animation-name: waveLeft; }
.wave-right { animation-name: waveRight; }
@keyframes waveTop {
  0% { transform: translate(-50%, -20px) rotate(0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.8); opacity: 0; }
}
@keyframes waveLeft {
  0% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.75); opacity: 0; }
}
@keyframes waveRight {
  0% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.75); opacity: 0; }
}
.center { display: flex; justify-content: center; }
@media (prefers-reduced-motion: reduce) {
  .blob, .cloud, .sky-star, .mascot, .rays, .medal-3d, .shine, .result-title .letter,
  .stage.slide-in, .stage.pop-in, .app.shake, .confetti-piece, .seal-big, .unlock, .curiosity, .seal-circle.got {
    animation: none !important;
    filter: none !important;
    transform: none !important;
  }
  .medal-mini { filter: none; opacity: 0.55; }
}
</style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div id="sky-stars"></div>
  </div>
  <canvas id="fx"></canvas>
  <div class="confetti-layer" id="confetti"></div>
  <main class="wrap">
    <div class="note" style="padding:8px 12px;font-size:12px">
      <strong style="display:inline;font-size:12px">Protótipo de teste.</strong>
      Nada é enviado nem coletado.
    </div>
    <div class="app" id="app"></div>
    <div class="note" style="margin-top:14px">
      <strong>Como testar a explosão</strong>
      Toque em “Pular para o parabéns” para ver fogos, confete e a medalha agora, ou faça o quiz completo e toque em “Revelar meu perfil”. Use “Ver parabéns de novo” para repetir. O som de festa só toca depois de um toque seu.
    </div>
  </main>
  <script>
(function () {
  const BLUE = "#005CA1", YELLOW = "#FFE800", WHITE = "#FFFFFF", RED = "#E53935", GREEN = "#2E9B4A", GOLD = "#FFD24A";

  const PHASES = {

  function calcProfile(answers) {

    const tied = ["M", "C", "V", "E"].filter(function (k) { return scores[k] === max; });
    if (tied.length === 1) return tied[0];
    for (const id of ["p4q1", "p4q2", "p1q1"]) {

      if (p && tied.indexOf(p) !== -1) return p;

      mascotRow("Olha só o perfil de vocês! Fiquei feliz em caminhar com a sua família. ⭐", true) +
      '<p class="invite">Que tal conhecer mais de perto? Escolha o melhor dia para a nossa visita 😄</p>' +
      "<p style=\"font-size:13px\">Ficaríamos muito felizes em passar rapidinho, uns 5 minutos ⏰, para mostrar a revista, sem compromisso.</p>" +
      '<div class="visits">' + visits + "</div>" + confirmation +
      '<button class="btn" type="button" data-action="replay">Ver parabéns de novo</button>' +
      '<button class="btn-quiet" type="button" data-action="restart">Recomeçar</button>' +
      "</div>";
  }

  function render(mode) {
    const step = state.step.kind;
    const html =
      step === "intro" ? renderIntro() :
      step === "question" ? renderQuestion() :
      step === "phase" ? renderPhase() :
      step === "tip" ? renderTip() :
      renderResult();
    app.innerHTML = '<div class="card" id="card">' + html + "</div>";
    if (mode === "celebrate") celebrate();
  }

  function unlockAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playFanfare() {
    const ctx = unlockAudio();
    if (!ctx) return;
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach(function (freq, i) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      const t = now + i * 0.085;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.16, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.48);
    });
    const bufferSize = Math.floor(ctx.sampleRate * 0.28);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "highpass"; filter.frequency.value = 900;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.12, now);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
    noise.connect(filter); filter.connect(ng); ng.connect(ctx.destination);
    noise.start(now);
  }

  function vibrate() {
    try { if (navigator.vibrate) navigator.vibrate([50, 40, 60, 40, 80, 50, 180]); } catch (e) {}
  }

  function resizeFx() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fx.width = Math.floor(window.innerWidth * dpr);
    fx.height = Math.floor(window.innerHeight * dpr);
    fx.style.width = window.innerWidth + "px";
    fx.style.height = window.innerHeight + "px";
    return dpr;
  }

  function launchFireworks() {
    cancelAnimationFrame(fwRaf);
    const dpr = resizeFx();
    const ctx = fx.getContext("2d");
    const sparks = [];
    const rings = [];
    const colors = [YELLOW, GOLD, WHITE, RED, GREEN, BLUE, "#FF9F1C", "#FFF6A0", "#FF4D6D"];
    function boom(x, y, n) {
      rings.push({ x: x, y: y, r: 4 * dpr, vr: 2.8 * dpr, life: 1, color: colors[Math.floor(Math.random() * 6)] });
      for (let i = 0; i < n; i++) {
        const ang = (Math.PI * 2 * i) / n + Math.random() * 0.25;
        const speed = (2.8 + Math.random() * 6.8) * dpr;
        sparks.push({
          x: x, y: y,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed - 0.8 * dpr,
          life: 1,
          decay: 0.010 + Math.random() * 0.012,
          color: colors[(i + Math.floor(Math.random() * 4)) % colors.length],
          size: (2.4 + Math.random() * 3.6) * dpr
        });
      }
    }
    const W = function () { return fx.width; };
    const H = function () { return fx.height; };
    const schedule = [0, 160, 320, 480, 640, 820, 1000, 1200, 1450, 1700, 1950];
    schedule.forEach(function (t, i) {
      setTimeout(function () {
        const side = i % 3;
        const x = side === 0 ? W() * (0.12 + Math.random() * 0.2)
          : side === 1 ? W() * (0.68 + Math.random() * 0.2)
          : W() * (0.35 + Math.random() * 0.3);
        const y = H() * (0.07 + (i % 4) * 0.07 + Math.random() * 0.05);
        boom(x, y, 64 + (i % 3) * 12);
      }, t);
    });
    const start = performance.now();
    function tick(now) {
      ctx.clearRect(0, 0, W(), H());
      ctx.globalCompositeOperation = "source-over";
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.r += r.vr;
        r.life -= 0.03;
        if (r.life <= 0) { rings.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.strokeStyle = r.color;
        ctx.globalAlpha = r.life * 0.85;
        ctx.lineWidth = 3 * dpr;
        ctx.stroke();
      }
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.06 * dpr;
        s.life -= s.decay;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(s.life, 0);
        ctx.shadowBlur = 10 * dpr;
        ctx.shadowColor = s.color;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = Math.max(s.life, 0) * 0.9;
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (now - start < 4500 || sparks.length || rings.length) fwRaf = requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, W(), H());
    }
    ctx.clearRect(0, 0, W(), H());
    fwRaf = requestAnimationFrame(tick);
  }

  function launchConfetti() {
    confettiLayer.innerHTML = "";
    const colors = [BLUE, YELLOW, WHITE, RED, GREEN, GOLD];
    function piece(wave, x, y, dx, dy, rot, size, color, kind, delay, duration) {
      const el = document.createElement("span");
      el.className = "confetti-piece " + wave;
      const radius = kind === 1 ? "50%" : "2px";
      const clip = kind === 2 ? "polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)" : "none";
      el.style.cssText = "left:" + x + ";top:" + y + ";width:" + size + "px;height:" + (kind === 1 ? size : size * 1.25) + "px;background:" + color +
        ";border-radius:" + radius + ";clip-path:" + clip + ";--dx:" + dx + "px;--dy:" + dy + "px;--rot:" + rot + "deg;animation-duration:" + duration +
        "s;animation-delay:" + delay + "s;animation-timing-function:cubic-bezier(.15,.7,.3,1);box-shadow:" + (color === WHITE ? "0 0 0 1px rgba(0,92,161,.25)" : "none");
      confettiLayer.appendChild(el);
    }
    // Wave 1: from the top
    for (let i = 0; i < 50; i++) {
      piece("wave-top", (4 + Math.random() * 92) + "%", "-8px", (Math.random() - 0.5) * 140, 620 + Math.random() * 280, 200 + Math.random() * 400, 8 + Math.random() * 8, colors[i % 6], i % 3, Math.random() * 0.15, 1.7 + Math.random() * 0.6);
    }
    // Wave 2: from the left
    setTimeout(function () {
      for (let i = 0; i < 40; i++) {
        piece("wave-left", "-10px", (8 + Math.random() * 70) + "%", 280 + Math.random() * 420, 180 + Math.random() * 360, 260 + Math.random() * 300, 8 + Math.random() * 8, colors[(i + 2) % 6], i % 3, Math.random() * 0.12, 1.6 + Math.random() * 0.5);
      }
    }, 220);
    // Wave 3: from the right
    setTimeout(function () {
      for (let i = 0; i < 40; i++) {
        piece("wave-right", "calc(100% + 10px)", (8 + Math.random() * 70) + "%", -(280 + Math.random() * 420), 180 + Math.random() * 360, -(260 + Math.random() * 300), 8 + Math.random() * 8, colors[(i + 4) % 6], i % 3, Math.random() * 0.12, 1.6 + Math.random() * 0.5);
      }
    }, 480);
    setTimeout(function () { confettiLayer.innerHTML = ""; }, 4500);
  }

  function celebrate() {
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    app.classList.remove("shake");
    void app.offsetWidth;
    if (!reduced) app.classList.add("shake");
    setTimeout(function () { app.classList.remove("shake"); }, 600);
    launchFireworks();
    if (!reduced) launchConfetti();
    vibrate();
    playFanfare();
  }

  function clearAdvance() {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  }

  function startAdvance() {
    clearAdvance();
    const index = state.step.index;
    advanceTimer = setTimeout(function () {
      const question = QUESTIONS[index];
      const last = index === QUESTIONS.length - 1;
      const phaseEnd = last || QUESTIONS[index + 1].phase !== question.phase;
      state.picked = null; state.praise = ""; state.locked = false;
      state.step = phaseEnd ? { kind: "phase", phase: question.phase } : { kind: "question", index: index + 1 };
      render();
    }, 900);
  }

  function goToResult(nextAnswers) {
    if (nextAnswers) state.answers = Object.assign({}, nextAnswers);
    state.visit = null;
    state.burstId += 1;
    state.step = { kind: "result" };
    render("celebrate");
  }

  function restart() {
    clearAdvance();
    cancelAnimationFrame(fwRaf);
    const ctx = fx.getContext("2d");
    ctx.clearRect(0, 0, fx.width, fx.height);
    confettiLayer.innerHTML = "";
    state.step = { kind: "intro" };
    state.answers = {};
    state.locked = false;
    state.picked = null;
    state.praise = "";
    state.visit = null;
    render();
  }

  app.addEventListener("click", function (event) {
    const button = event.target.closest("[data-action]");
    if (!button) return;
    const action = button.getAttribute("data-action");
    if (action === "start" || action === "skip" || action === "continue-phase" || action === "replay") unlockAudio();
    if (action === "start") {
      state.step = { kind: "question", index: 0 };
      render();
    } else if (action === "skip") {
      goToResult(SAMPLE_ANSWERS);
    } else if (action === "pick") {
      if (state.locked || state.step.kind !== "question") return;
      const question = QUESTIONS[state.step.index];
      const letter = button.getAttribute("data-letter");
      const option = question.options.find(function (item) { return item.letter === letter; });
      if (!option) return;
      state.locked = true;
      state.picked = option.letter;
      state.praise = question.praise;
      state.answers[question.id] = option.profile;
      render();
      startAdvance();
    } else if (action === "continue-phase" && state.step.kind === "phase") {
      const phase = state.step.phase;
      if (phase === 2) { state.step = { kind: "tip" }; render(); }
      else if (phase === 4) goToResult();
      else {
        const next = QUESTIONS.findIndex(function (q) { return q.phase === phase + 1; });
        state.step = { kind: "question", index: next };
        render();
      }
    } else if (action === "continue-tip") {
      const next = QUESTIONS.findIndex(function (q) { return q.phase === 3; });
      state.step = { kind: "question", index: next };
      render();
    } else if (action === "visit") {
      state.visit = button.getAttribute("data-id");
      render();
    } else if (action === "replay") {
      state.burstId += 1;
      render("celebrate");
    } else if (action === "restart") {
      restart();
    }
  });

  // Decorative sky stars
  const sky = document.getElementById("sky-stars");
  if (sky) {
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("span");
      s.className = "sky-star";
      s.textContent = i % 4 === 0 ? "✦" : "★";
      s.style.left = (4 + Math.random() * 92) + "%";
      s.style.top = (4 + Math.random() * 88) + "%";
      s.style.fontSize = (8 + Math.random() * 12) + "px";
      s.style.animationDelay = (-Math.random() * 8) + "s";
      sky.appendChild(s);
    }
  }
  window.addEventListener("resize", function () { if (state.step.kind === "result") resizeFx(); });
  render();
})();

  </script>
</body>
</html>
