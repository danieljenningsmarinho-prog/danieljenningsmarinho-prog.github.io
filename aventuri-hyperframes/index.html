<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aventuri ANSR 2026</title>
<style>
  :root { --navy:#071A3D; --deep:#040F26; --blue:#005CA1; --yellow:#FFE14A; --teal:#3CCFC0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--deep); color:#fff; font-family:Inter, "Helvetica Neue", Arial, sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  .stage { position:relative; background:var(--navy); border-radius:10px; overflow:hidden;
           box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .stage.v { aspect-ratio:9/16; height:min(calc(100vh - 150px), calc((100vw - 32px) * 16 / 9)); }
  .stage.h { aspect-ratio:16/9; width:min(calc(100vw - 32px), calc((100vh - 150px) * 16 / 9)); }
  video { width:100%; height:100%; display:block; object-fit:contain; }
  .label { font-size:14px; letter-spacing:3px; text-transform:uppercase; color:var(--teal); font-weight:700; min-height:18px; text-align:center; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-weight:700; font-size:14px; color:#fff; background:var(--blue); border:0;
           border-radius:999px; padding:10px 18px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  button:hover { filter:brightness(1.15); }
  button.accent { background:var(--yellow); color:var(--navy); }
  button svg { width:16px; height:16px; }
</style>
</head>
<body>
  <div id="stage" class="stage v">
    <video id="vid" src="renders/aventuri-vertical.mp4" autoplay muted loop playsinline preload="auto"></video>
  </div>
  <div class="label" id="label">Abertura</div>
  <div class="bar">
    <button id="prev" aria-label="Voltar cena"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg>Voltar</button>
    <button id="play" class="accent" aria-label="Pausar"><span id="playIcon"></span><span id="playTxt">Pausar</span></button>
    <button id="next" aria-label="Avançar cena">Avançar<svg viewBox="0 0 16 16" fill="currentColor"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    <button id="fmt">Formato 16:9</button>
  </div>
<script>
  // início de cada cena em segundos, igual a build.mjs
  const SCENES = [
    [0, 'Abertura'], [5, 'Sexta · Montagem'], [12.5, 'Sexta · 1ª apresentação'],
    [18.5, 'Sábado · 2ª apresentação'], [24.5, 'Sábado · Noite livre'], [30, 'Sábado · Prospecção'],
    [38.5, 'Domingo · 3ª apresentação'], [45, 'Domingo · Desmontagem'],
    [51, 'Segunda · Reunião na Associação'], [57.5, 'Encerramento'],
  ].map(([t, l]) => ({t, l}));
  const vid = document.getElementById('vid'), stage = document.getElementById('stage');
  const label = document.getElementById('label'), playTxt = document.getElementById('playTxt');
  const playIcon = document.getElementById('playIcon');
  const ICON_PAUSE = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';
  const ICON_PLAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2v12l11-6z"/></svg>';
  const idx = () => { let i = 0; SCENES.forEach((s, k) => { if (vid.currentTime >= s.t + 0.01) i = k; }); return i; };
  const sync = () => { const p = vid.paused; playTxt.textContent = p ? 'Reproduzir' : 'Pausar'; playIcon.innerHTML = p ? ICON_PLAY : ICON_PAUSE; };
  const go = (i) => { i = (i + SCENES.length) % SCENES.length; vid.currentTime = SCENES[i].t; label.textContent = SCENES[i].l; };
  document.getElementById('play').onclick = () => { vid.paused ? vid.play() : vid.pause(); };
  document.getElementById('prev').onclick = () => { const i = idx(); go(vid.currentTime - SCENES[i].t > 1.5 ? i : i - 1); };
  document.getElementById('next').onclick = () => go(idx() + 1);
  document.getElementById('fmt').onclick = (e) => {
    const t = vid.currentTime, paused = vid.paused, toH = stage.classList.contains('v');
    stage.className = 'stage ' + (toH ? 'h' : 'v');
    vid.src = toH ? 'renders/aventuri-horizontal.mp4' : 'renders/aventuri-vertical.mp4';
    e.currentTarget.textContent = toH ? 'Formato 9:16' : 'Formato 16:9';
    vid.addEventListener('loadedmetadata', () => { vid.currentTime = t; if (!paused) vid.play(); }, {once: true});
  };
  vid.addEventListener('play', sync); vid.addEventListener('pause', sync);
  vid.addEventListener('timeupdate', () => { label.textContent = SCENES[idx()].l; });
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('play').click(); }
    if (e.key === 'ArrowRight') document.getElementById('next').click();
    if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  });
  sync();
</script>
</body>
</html>
