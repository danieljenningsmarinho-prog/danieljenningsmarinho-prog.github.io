<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Colportor</title>
    <script>
      (function () {
        var path = location.pathname;
        if (path.indexOf('/quiz') === 0) {
          location.replace('/quiz/');
          return;
        }
        var m = path.match(/^\/colportor\/?(.*)$/);
        if (m) {
          var rest = (m[1] || '').replace(/\/+$/, '');
          if (rest && !/^(_expo|assets|favicon|metadata)/.test(rest)) {
            location.replace('/colportor/#' + decodeURIComponent(rest));
          } else {
            location.replace('/colportor/');
          }
          return;
        }
        location.replace('/');
      })();
    </script>
  </head>
  <body></body>
</html>
